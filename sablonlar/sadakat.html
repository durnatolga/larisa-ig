<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Poppins,sans-serif;
background:radial-gradient(circle at 20% 15%,#1f8f8a 0%,#0e5f5c 45%,#083d3b 100%);color:#fff;position:relative;overflow:hidden}
.ring{position:absolute;border:2px solid rgba(212,175,106,.35);border-radius:50%}
.r1{width:900px;height:900px;right:-420px;top:-380px}
.r2{width:600px;height:600px;left:-300px;bottom:-260px}
.wrap{position:absolute;inset:70px;border:2px solid #d4af6a;border-radius:28px;padding:70px 70px 60px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{font-family:Lora,serif;letter-spacing:10px;font-size:30px;color:#e9cf96}
.sub{font-size:20px;letter-spacing:6px;color:#bfe3df;margin-top:6px}
h1{font-family:Lora,serif;font-weight:700;font-size:96px;line-height:1.05;margin-top:70px}
h1 span{color:#e9cf96;font-style:italic}
.lead{font-size:30px;color:#d6eeeb;margin-top:22px;font-weight:300}
.dots{display:flex;gap:26px;margin-top:70px}
.dot{width:96px;height:96px;border-radius:50%;border:3px solid #d4af6a;display:flex;align-items:center;justify-content:center;font-size:40px;color:#e9cf96;font-weight:600}
.dot.f{background:linear-gradient(135deg,#f1d9a4,#c99a4a);color:#0b4644;font-size:24px;font-weight:700;border:none}
.rule{margin-top:26px;font-size:30px}
.rule b{color:#e9cf96}
.box{margin-top:60px;background:rgba(255,255,255,.08);border:1px solid rgba(233,207,150,.5);border-radius:22px;padding:30px 44px;font-size:30px;line-height:1.45}
.box b{color:#e9cf96}
.foot{margin-top:auto;font-size:24px;color:#bfe3df;letter-spacing:1px}
.foot b{color:#fff;font-weight:600}
</style></head><body>
<div class="ring r1"></div><div class="ring r2"></div>
<div class="wrap">
  <div class="brand">LARISA BEAUTY</div>
  <div class="sub">KİRPİK · TIRNAK · CİLT BAKIMI</div>
  <h1>Dijital<br><span>Sadakat Kartı</span></h1>
  <div class="lead">Her ziyaretin artık kazandırıyor</div>
  <div class="dots">
    <div class="dot">1</div><div class="dot">2</div><div class="dot">3</div><div class="dot">4</div><div class="dot">5</div><div class="dot f">HEDİYE</div>
  </div>
  <div class="rule">Aynı işlemden <b>5 tane</b> yaptır, <b>1'i bizden!</b></div>
  <div class="box">+ <b>2 arkadaşını</b> getir,<br><b>1 uygulama</b> hediye 💛</div>
  <div class="foot">Mavişehir · Park Yaşam Ofis &nbsp;|&nbsp; <b>larisabeautyclub.com</b></div>
</div>
</body></html>
