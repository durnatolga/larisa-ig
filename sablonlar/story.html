<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:Poppins,sans-serif;background:radial-gradient(circle at 30% 25%,#1f8f8a,#0b4f4c 55%,#062f2d);color:#fff;text-align:center;position:relative;overflow:hidden}
.brand{position:absolute;top:260px;left:0;right:0;font-family:Lora,serif;letter-spacing:12px;font-size:34px;color:#e9cf96}
.gift{position:absolute;top:520px;left:50%;transform:translateX(-50%);width:300px;height:300px;border-radius:50%;background:linear-gradient(135deg,#f1d9a4,#c99a4a);display:flex;align-items:center;justify-content:center;font-size:150px;box-shadow:0 0 0 30px rgba(233,207,150,.12),0 0 0 70px rgba(233,207,150,.06)}
h1{position:absolute;top:960px;left:60px;right:60px;font-family:Lora,serif;font-size:96px;line-height:1.1}
h1 i{color:#e9cf96}
p{position:absolute;top:1260px;left:100px;right:100px;font-size:40px;font-weight:300;color:#d6eeeb;line-height:1.4}
.pill{position:absolute;top:1480px;left:50%;transform:translateX(-50%);border:2px solid #d4af6a;border-radius:60px;padding:22px 56px;font-size:36px;color:#e9cf96;letter-spacing:2px}
</style></head><body>
<div class="brand">LARISA BEAUTY</div>
<div class="gift">🎁</div>
<h1>Pazartesi<br><i>bir sürprizimiz</i> var</h1>
<p>Her ziyaretini kazanca çeviren yeniliği ilk sen öğren</p>
<div class="pill">TAKİPTE KAL ✨</div>
</body></html>
